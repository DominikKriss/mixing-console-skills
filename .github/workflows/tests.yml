name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lua for the ReaScript tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Unit tests
        env:
          REQUIRE_LUA: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          PY=""; for c in python3 python; do if "$c" -c "" >/dev/null 2>&1; then PY="$c"; break; fi; done
          "$PY" --version
          for d in */tests; do
            "$PY" -m unittest discover -s "$d" -t "$d" -v
          done
      - name: ADR index
        run: |
          PY=""; for c in python3 python; do if "$c" -c "" >/dev/null 2>&1; then PY="$c"; break; fi; done
          "$PY" -m unittest discover -s .github/scripts -t .github/scripts -v
          "$PY" .github/scripts/check_adr_index.py
      - name: contribute.sh is the same in every skill
        run: for f in */scripts/contribute.sh; do cmp lv1-session/scripts/contribute.sh "$f"; done
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck */scripts/*.sh

  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Branch is feature/<issue>_<desc> or fix/<issue>_<desc>
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(feature|fix)/[0-9]+_[a-z0-9][a-z0-9._-]*$ || "$BRANCH" =~ ^learn/ ]]; then
            echo "ok: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' must be feature/<issue>_<short-desc> or fix/<issue>_<short-desc>, e.g. feature/8_windows-support (see AGENTS.md)."
            exit 1
          fi
